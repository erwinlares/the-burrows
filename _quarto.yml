project:
  type: website
  output-dir: _site
  
execute:
  freeze: auto

website:
  title: "The Burrows"
  page-footer:
    left: "© 2026 BRUG — Badger R Users Group. Code: MIT · Content: CC BY 4.0"
    center: "Start on campus. Stay open. Propagate outward."
    right:
      - icon: github
        href: https://github.com/erwinlares/the-burrows  
  favicon: assets/brug-logo.png
  description: "Badger R Users Group — a community of practice for R coders at UW–Madison"
  navbar:
    background: "#C5050C"
    foreground: "#FFFFFF"
    logo: assets/brug-logo.png
    logo-alt: "BRUG logo — an isometric R die"
    right:
      - icon: github
        href: https://github.com/erwinlares/the-burrows
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: events/index.qmd
        text: Events
      - href: blog/index.qmd
        text: Blog
      - href: resources/index.qmd
        text: Resources
      - href: presentations/index.qmd
        text: Presentations
      - href: discussions/index.qmd
        text: Discussions
      - href: community.qmd
        text: Broader Community

format:
  html:
    theme: cosmo
    css: assets/brug-theme.scss
    toc: true
    text: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    mermaid:
      theme: neutral
    comments:
      giscus:
        repo: "erwinlares/the-burrows"
        repo-id: "R_kgDOSsYW6w"
        category: "Comments"
        category-id: "DIC_kwDOSsYW684DAxwp"
        mapping: "pathname"
        reactions-enabled: true
        input-position: "bottom"
        theme: "preferred_color_scheme"
        loading: "lazy"